<!-- templates/webauthn_register.html -->
{% extends 'base.html' %}
{% block content %}
<h3>Register your device for biometric confirmation</h3>
<button id="register">Register device</button>
<p id="status"></p>

<script>
async function toArrayBuffer(base64url) {
  const pad = '='.repeat((4 - base64url.length % 4) % 4);
  const b64 = base64url.replace(/-/g, '+').replace(/_/g, '/') + pad;
  const raw = atob(b64);
  const buf = new ArrayBuffer(raw.length);
  const view = new Uint8Array(buf);
  for (let i = 0; i < raw.length; i++) view[i] = raw.charCodeAt(i);
  return buf;
}

document.getElementById('register').onclick = async () => {
  document.getElementById('status').textContent = 'Starting...';
  const optsResp = await fetch("{% url 'webauthn_register_start' %}");
  const options = await optsResp.json();

  // Convert challenge and user.id to ArrayBuffer
  options.challenge = await toArrayBuffer(options.challenge);
  options.user.id = await toArrayBuffer(options.user.id);

  // Create credential (prompts fingerprint/Face ID if needed)
  const cred = await navigator.credentials.create({ publicKey: options });

  // Send attestation to server
  const payload = {
    id: cred.id,
    rawId: btoa(String.fromCharCode(...new Uint8Array(cred.rawId))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
    type: cred.type,
    response: {
      attestationObject: btoa(String.fromCharCode(...new Uint8Array(cred.response.attestationObject))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
      clientDataJSON: btoa(String.fromCharCode(...new Uint8Array(cred.response.clientDataJSON))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),
    }
  };

  const finish = await fetch("{% url 'webauthn_register_finish' %}", {
    method: 'POST',
    headers: {'Content-Type':'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
    body: JSON.stringify(payload)
  });

  if (finish.ok) {
    document.getElementById('status').textContent = 'Device registered successfully.';
  } else {
    document.getElementById('status').textContent = 'Registration failed.';
  }
};
</script>
{% endblock %}
