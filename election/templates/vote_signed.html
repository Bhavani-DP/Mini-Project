<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vote Signed</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 50px;
            margin: 0;
            background-color: #f9f9f9;
        }
        .success {
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            font-size: 18px;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: left;
        }
        .label {
            color: red;
            font-weight: bold;
            text-align: right;
            margin-bottom: 10px;
        }
        .hash {
            font-family: monospace;
            word-break: break-all;
            margin-top: 10px;
            background: #f0f0f0;
            padding: 8px;
            border-radius: 4px;
        }
        h3 {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="success">✅ Your vote has been signed successfully.</div>

    <div class="box">
        <div class="label">
            {{ voter.aadhar_number }} ({{ voter.name }})
        </div>

        <h3>Your Ballot Hash:</h3>
        <div class="hash">{{ ballot_hash }}</div>

        <h3>Government Signature:</h3>
        <div class="hash">{{ gov_signature }}</div>
    </div>
</body>
</html>
