{% extends "admin/base_site.html" %}
{% block content %}
<h1>Biometric Enrollment</h1>

<button id="addFingerBtn">Add Finger</button>

<div id="fingerInterface" style="display:none; margin-top:20px; border:1px solid #ccc; padding:20px;">
  <h3>Fingerprint Capture Interface</h3>
  <div style="width:300px; height:200px; background:#eee; display:flex; align-items:center; justify-content:center;">
    <p>Place finger on scanner...</p>
  </div>
</div>

<script>
  document.getElementById("addFingerBtn").addEventListener("click", function() {
    document.getElementById("fingerInterface").style.display = "block";
  });
</script>
{% endblock %}
