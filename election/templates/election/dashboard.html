{% extends 'election/base.html' %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div style="text-align: center; margin: 50px;">
    <h1>Election Dashboard</h1>
    <p>Welcome to the election dashboard.</p>
    <a href="{% url 'vote_count' %}" style="text-decoration: none;">
        <button style="padding: 10px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">Show Votes</button>
    </a>
    <br><br>
    <a href="http://127.0.0.1:8000/admin" style="text-decoration: none;">
        <button style="padding: 10px 20px; font-size: 16px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">Admin</button>
    </a>
</div>
{% endblock %}
