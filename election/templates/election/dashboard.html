<!DOCTYPE html>
<html>
<head>
    <title>Indian Election using Blockchain</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            display: flex;
        }
        .sidebar {
            width: 220px;
            background-color: #2c3e50;
            color: white;
            height: 100vh;
            padding-top: 30px;
        }
        .sidebar a {
            display: block;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
        }
        .sidebar a:hover {
            background-color: #34495e;
        }
        .main {
            flex: 1;
            padding: 40px;
            background-color: #f4f4f4;
        }
        .header {
            font-size: 20px;
            margin-bottom: 30px;
            color: #333;
        }
        .auth-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 500px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .btn-orange {
            background-color: orange;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="#">Dummy Data</a>
        <a href="#">Show Votes Count</a>
        <a href="#">Mine Blocks</a>
        <a href="#">Block Chain</a>
        <a href="/admin/">Admin</a>
    </div>
    <div class="main">
        <div class="header">
            Please Enter your Aadhar Card Number to Authenticate yourself in order to cast your vote.
        </div>
        <div class="auth-box">
            <form method="POST" action="/authenticate_voter/">
                {% csrf_token %}
                <input type="text" name="aadhaar" placeholder="XXXX XXXX XXXX" required>
                <br>
                <button type="submit" class="btn-orange">Authenticate</button>
            </form>
        </div>
    </div>
</body>
</html>
