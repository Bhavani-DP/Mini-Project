<!DOCTYPE html>
<html>
<head>
    <title>Online Voting Home</title>
</head>
<body>
    <h2>Welcome to the Online Voting System</h2>
    <form method="POST" action="{% url 'verify_email' %}">
        {% csrf_token %}

        {% if error %}
      <p style="color:red;">{{ error }}</p>
    {% endif %}

        <label for="aadhaar">Enter Aadhaar Number:</label>
        <input type="text" name="aadhaar" required>
        <button type="submit">Verify</button>
    </form>
</body>
</html>
