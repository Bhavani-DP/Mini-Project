<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Online Voting System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      position: relative;
    }

    /* Background image */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url("{% static 'images/backgroung.jpg' %}") no-repeat center center;
      background-size: 100%;
      background-repeat: no-repeat;
      z-index: -1;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .form-group {
      text-align: center;
    }

    input[type="text"] {
      padding: 10px;
      font-size: 1.5em;
      width: 280px;
      text-align: center;
      letter-spacing: 2px;
      font-family: monospace;
    }

    button {
  margin-top: 15px;
  padding: 10px 20px;
  font-size: 1em;
  cursor: pointer;
  background-color: #28a745; /* ✅ Green */
  color: white;
  border: none;
  border-radius: 5px;
}
  </style>
</head>
<body>

  <h1>Welcome to the Online Voting System</h1>

  <div class="form-group">
    <a href="{% url 'verify_aadhaar' %}"><button>Enter Aadhaar Number</button></a>
  </div>

  <script>
    function maskAadhaar(input) {
      let digits = input.value.replace(/\D/g, '').slice(0, 12);
      let masked = 'XXXXXXXXXXXX'.split('');
      for (let i = 0; i < digits.length; i++) {
        masked[i] = digits[i];
      }
      let formatted = masked.join('').replace(/(.{4})(.{4})(.{4})/, '$1 $2 $3');
      input.value = formatted;
    }
  </script>

</body>
</html>
