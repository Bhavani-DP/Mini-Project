{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verifying OTP</title>
  <!-- After 5 seconds, redirect to voter_details -->
  <meta http-equiv="refresh" content="5;url={% url 'voter_details' %}">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .logo img {
      width: 180px;
      margin-bottom: 10px;
    }
    .title {
      font-size: 26px;
      font-weight: bold;
      color: #aaa;
      margin-top: 10px;
    }
    .subtitle {
      font-size: 18px;
      color: #aaa;
      margin-bottom: 30px;
    }
    .otp-box {
      background-color: #fff;
      border-top: 2px solid #ccc;
      border-bottom: 2px solid #ccc;
      padding: 20px;
      width: 100vw;
      font-size: 16px;
      color: #333;
      text-align: center;
      font-weight: bold;
      box-sizing: border-box;
      margin-top: 20px;
    }
    .dots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }
    .dot {
      border-radius: 50%;
      animation: pop 1s infinite ease-in-out;
    }
    .dot:nth-child(1) { width: 12px; height: 12px; background-color: red; animation-delay: 0s; }
    .dot:nth-child(2) { width: 10px; height: 10px; background-color: orange; animation-delay: 0.2s; }
    .dot:nth-child(3) { width: 8px; height: 8px; background-color: yellowgreen; animation-delay: 0.4s; }
    .dot:nth-child(4) { width: 6px; height: 6px; background-color: green; animation-delay: 0.6s; }
    @keyframes pop {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.5); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="{% static 'images/election_logo.png' %}" alt="Election Logo">
      <div class="title">INDIAN ELECTION</div>
      <div class="subtitle">using Blockchain</div>
    </div>
    <!-- 🔑 Change the message here -->
    <div class="otp-box">Please wait.......... your OTP is being sent.</div>
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
