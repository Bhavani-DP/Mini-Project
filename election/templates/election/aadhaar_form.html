<!DOCTYPE html>
<html>
<head>
  <title>Aadhaar Input Test</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 40px;
      background-color: #f9f9f9;
    }
    input {
      font-size: 20px;
      padding: 10px;
      width: 300px;
    }
  </style>
</head>
<body>
  <h2>Test Aadhaar Input</h2>

  <form method="POST" action="{% url 'verify_aadhaar' %}">
    {% csrf_token %}
    <input type="text" name="aadhaar" placeholder="Enter Aadhaar Number" autocomplete="off" spellcheck="false" required />
    <button type="submit">Authenticate</button>
  </form>
</body>
</html>
