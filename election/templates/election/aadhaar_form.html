<!DOCTYPE html>
<html>
<head>
  <title>Online Voting System</title>
  <style>
    body {
      font-family: sans-serif;
      background-color: #f2f2f2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    form {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    #masked {
      font-size: 24px;
      letter-spacing: 4px;
      padding: 10px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background-color: white;
      margin-bottom: 20px;
      text-align: center;
      font-family: monospace;
    }

    input[type="hidden"] {
      display: none;
    }

    button {
      background-color: #28a745;
      color: white;
      font-size: 16px;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <h1>Welcome to the Online Voting System</h1>
  <form method="POST" action="{% url 'verify_aadhaar' %}">
    {% csrf_token %}
    {% if error %}
      <p style="color: red; margin-bottom: 10px;">{{ error }}</p>
    {% endif %}
    <div id="masked" tabindex="0"></div>
    <input type="hidden" name="aadhaar" id="aadhaar" />
    <button type="submit">Verify</button>
  </form>

  <script>
    const masked = document.getElementById("masked");
    const hiddenInput = document.getElementById("aadhaar");
    let digits = "";

    function formatMasked(value) {
      let padded = value.padEnd(12, "X");
      return padded.replace(/(.{4})(.{4})(.{4})/, "$1 $2 $3");
    }

    function updateDisplay() {
      masked.textContent = formatMasked(digits);
      hiddenInput.value = digits;
    }

    masked.addEventListener("keydown", function(e) {
      if (e.key >= "0" && e.key <= "9" && digits.length < 12) {
        digits += e.key;
        updateDisplay();
      } else if (e.key === "Backspace" && digits.length > 0) {
        digits = digits.slice(0, -1);
        updateDisplay();
      }
      e.preventDefault();
    });

    masked.addEventListener("click", () => masked.focus());

    updateDisplay(); // initial render
  </script>
</body>
</html>
