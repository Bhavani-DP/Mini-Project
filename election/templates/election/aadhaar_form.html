<!DOCTYPE html>
<html>
<head>
  <title>Online Voting System</title>
  {% load static %}
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* Background image (no blur) */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url("{% static 'images/backgroung.jpg' %}") no-repeat center center;
      background-size: 100%;
      background-repeat: no-repeat;
      z-index: -1;
    }

    /* Simple welcome text */
    h1 {
      text-align: center;
      font-size: 42px;
      font-family: "Trebuchet MS", sans-serif;
      color: #00ffff; /* bright cyan */
      text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
      z-index: 1;
      letter-spacing: 4px;
      margin-bottom: 40px;
    }

    /* Form styling */
    form {
      background: transparent;
      padding: 30px;
      border-radius: 8px;
      text-align: center;
      z-index: 1;
    }

    #masked {
      font-size: 28px;
      letter-spacing: 6px;
      padding: 14px 20px;
      width: 320px;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.3);
      margin-bottom: 30px;
      text-align: center;
      font-family: 'Courier New', monospace;
      color: #333333;
      font-weight: bold;
      outline: none;
    }

    button {
      background-color: #28a745;
      color: white;
      font-size: 18px;
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 20px;
    }

    button:hover {
      background-color: #218838;
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 2;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.4);
    }

    .modal-content {
      background-color: #fefefe;
      margin: 15% auto;
      padding: 20px;
      border: 1px solid #888;
      width: 80%;
      max-width: 400px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .modal-header h2 {
      margin: 0;
      color: #e74c3c;
      font-size: 24px;
    }

    .btn {
      background-color: #e74c3c;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn:hover {
      background-color: #c0392b;
    }

    /* Hamburger Icon */
    .hamburger {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1001;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.8);
      padding: 10px;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .hamburger div {
      width: 25px;
      height: 3px;
      background: #333;
      margin: 5px 0;
      transition: 0.3s;
    }

    /* Sidebar */
    .sidebar {
      position: fixed;
      top: 0;
      left: -300px;
      width: 300px;
      height: 100%;
      background: #333;
      color: white;
      transition: left 0.3s ease;
      z-index: 1000;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }
    .sidebar.open {
      left: 0;
    }
    .sidebar h1 {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 30px;
      text-align: center;
    }
    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
      flex-grow: 1;
    }
    .sidebar li {
      margin-bottom: 20px;
      font-size: 16px;
      cursor: pointer;
      padding: 10px;
      border-radius: 5px;
      transition: background 0.3s;
    }
    .sidebar li:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .sidebar .back-btn {
      background: #ff9800;
      color: white;
      border: none;
      padding: 15px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: auto;
      transition: background 0.3s;
    }
    .sidebar .back-btn:hover {
      background: #e68900;
    }

    /* Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      display: none;
    }
    .overlay.active {
      display: block;
    }
  </style>
</head>
<body>
  <!-- Hamburger Icon -->
  <div class="hamburger" onclick="toggleSidebar()">
    <div></div>
    <div></div>
    <div></div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <h1>Indian Election using Blockchain</h1>
    <ul>
      <li><a href="{% url 'vote_count' %}" style="color:white; text-decoration:none;">Show vote counts</a></li>
    </ul>
    <button class="back-btn" onclick="closeSidebar()">← Back</button>
  </div>

  <!-- Overlay -->
  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- Static welcome heading -->
  <h1>Welcome to the Online Voting System</h1>

  <!-- Aadhaar Verification Form -->
  <form method="POST" action="{% url 'verify_aadhaar' %}">
    {% csrf_token %}
    <div id="masked" tabindex="0"></div>
    <input type="hidden" name="aadhaar" id="aadhaar" />
    <button type="submit">Verify</button>
  </form>

  <!-- Modal -->
  <div id="errorModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="close">&times;</span>
        <h2>⚠️ Notice</h2>
      </div>
      <div class="modal-body">
        {% if error %}
          <p>{{ error }}</p>
        {% endif %}
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal()">OK</button>
      </div>
    </div>
  </div>

  {% if error %}
    <div id="error-flag" data-error="{{ error }}"></div>
  {% endif %}

  <script>
    const masked = document.getElementById("masked");
    const hiddenInput = document.getElementById("aadhaar");
    const modal = document.getElementById("errorModal");
    const closeBtn = document.getElementsByClassName("close")[0];
    let digits = "";

    function formatMasked(value) {
      let padded = value.padEnd(12, "X");
      return padded.replace(/(.{4})(.{4})(.{4})/, "$1 $2 $3");
    }

    function updateDisplay() {
      masked.textContent = formatMasked(digits);
      hiddenInput.value = digits;
    }

    function openModal() { modal.style.display = "block"; }
    function closeModal() { modal.style.display = "none"; }

    window.onclick = function(event) {
      if (event.target == modal) { modal.style.display = "none"; }
    }

    masked.addEventListener("keydown", function(e) {
      if (e.key >= "0" && e.key <= "9" && digits.length < 12) {
        digits += e.key;
        updateDisplay();
      } else if (e.key === "Backspace" && digits.length > 0) {
        digits = digits.slice(0, -1);
        updateDisplay();
      }
      e.preventDefault();
    });

    masked.addEventListener("click", () => masked.focus());
    updateDisplay();

    // Handle modal display for errors
    window.addEventListener("DOMContentLoaded", () => {
      const errorFlag = document.getElementById("error-flag");
      if (errorFlag) { openModal(); }
    });

    closeBtn.onclick = function() { closeModal(); };

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      sidebar.classList.add('open');
      overlay.classList.add('active');
    }

    function closeSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
    }
  </script>
</body>
</html>
