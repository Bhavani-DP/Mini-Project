{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome</title>
  <!-- After 5 seconds, redirect to Aadhaar verify -->
  <meta http-equiv="refresh" content="5;url={% url 'verify_aadhaar' %}">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
    }
    .container { display: flex; flex-direction: column; align-items: center; }
    .logo img { width: 180px; margin-bottom: 10px; }
    .title { font-size: 26px; font-weight: bold; color: #aaa; margin-top: 10px; }
    .subtitle { font-size: 18px; color: #aaa; margin-bottom: 30px; }
    .otp-box {
      border-top: 2px solid #ccc; border-bottom: 2px solid #ccc;
      padding: 20px; width: 100vw; font-size: 16px; color: #333;
      text-align: center; font-weight: bold; font-family: 'Algerian', cursive;
      margin-top: 20px;
    }
    .dots { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
    .dot { border-radius: 50%; animation: pop 1s infinite ease-in-out; }
    .dot:nth-child(1){width:12px;height:12px;background:red;animation-delay:0s;}
    .dot:nth-child(2){width:10px;height:10px;background:orange;animation-delay:0.2s;}
    .dot:nth-child(3){width:8px;height:8px;background:yellowgreen;animation-delay:0.4s;}
    .dot:nth-child(4){width:6px;height:6px;background:green;animation-delay:0.6s;}
    @keyframes pop {0%,100%{transform:scale(1);opacity:0.6;}50%{transform:scale(1.5);opacity:1;}}
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="{% static 'images/election_logo.png' %}" alt="Election Logo">
      <div class="title">INDIAN ELECTION</div>
      <h2><div class="subtitle">using Blockchain</div></h2>
    </div>
    <div class="otp-box">"Your vote is your voice in the symphony of democracy."</div>
    <div class="dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <br><br>
    <a href="{% url 'dashboard' %}" style="color: white; text-decoration: none; font-size: 18px;">Go to Dashboard</a>
  </div>
</body>
</html>
