<!DOCTYPE html>
<html>
<head>
    <title>Confirm Your Vote</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f9f9f9;
            text-align: center;
            padding: 50px;
        }
        .banner {
            background-color: purple;
            color: white;
            padding: 12px;
            font-size: 18px;
            margin-bottom: 30px;
            border-radius: 6px;
        }
        .vote-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 500px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .party-logo {
            margin: 20px 0;
        }
        .btn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px;
        }
        .btn-green {
            background-color: green;
            color: white;
        }
        .btn-red {
            background-color: red;
            color: white;
        }
        input[type="text"] {
            width: 90%;
            padding: 10px;
            margin-top: 15px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="banner">Enter private key sent to your email-id</div>

    <div class="vote-box">
        <h2>Confirm Your Vote</h2>
        <p><strong>{{ party.name }}</strong></p>
        <div class="party-logo">
            <img src="{{ party.symbol.url }}" alt="{{ party.name }}" width="80">
        </div>

        <form method="POST" action="/finalize_vote/">
            {% csrf_token %}
            <input type="hidden" name="party_id" value="{{ party.id }}">
            <input type="text" name="private_key" placeholder="Paste your private key here" required>
            <br><br>
            <button type="submit" class="btn btn-green">Yes, Vote</button>
            <a href="/cast_vote/" class="btn btn-red">No, Cancel</a>
        </form>
    </div>
</body>
</html>
