<!DOCTYPE html>
<html>
<head>
  <title>Error</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f8d7da;
    }
    .message {
      color: #721c24;
      background-color: #f5c6cb;
      padding: 20px;
      border-radius: 8px;
      display: inline-block;
    }
    a {
      display: block;
      margin-top: 20px;
      color: #007bff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="message">
    <h2>Error</h2>
    <p>{{ message }}</p>
  </div>
  <a href="{% url 'home' %}">Go back</a>
</body>
</html>
