<!DOCTYPE html>
<html>
<head>
    <title>Django Administration Login</title>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: sans-serif;
        }
        .login-box {
            width: 400px;
            margin: 100px auto;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 30px;
            border-radius: 8px;
        }
        .login-header {
            background-color: #0C4B33;
            color: white;
            padding: 15px;
            font-size: 20px;
            text-align: center;
            border-radius: 6px 6px 0 0;
            margin: -30px -30px 20px -30px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="submit"] {
            background-color: #0C4B33;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
        }
        .error {
            color: red;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="login-header">Django Administration</div>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <label>Username:</label>
            <input type="text" name="username" required>
            <label>Password:</label>
            <input type="password" name="password" required>
            <input type="submit" value="Log in">
        </form>
    </div>
</body>
</html>
